name: Fork Sync - Linear Retry
on:
  schedule:
    - cron: "0 7 * * *" # Daily at 7 AM UTC
  workflow_dispatch:

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/anomalyco/opencode.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Update dev branch
        run: |
          git checkout --track origin/dev
          git merge upstream/dev

      - name: Switch to linear-retry branch
        run: |
          git checkout linear-retry || git checkout -b linear-retry dev

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Merge dev into linear-retry
        run: git merge dev

